<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Account & Health Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .toast {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Toast Notification -->
    <div id="toast" class="toast fixed top-5 right-5 bg-red-500 text-white py-2 px-4 rounded-lg shadow-md">
        <span id="toast-message"></span>
    </div>

    <!-- Main Container -->
    <div id="app-container" class="container mx-auto p-4 max-w-4xl">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Health & Account Tracker</h1>
            <button id="logout-btn" class="hidden bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition">Logout</button>
        </header>

        <!-- Auth Section -->
        <div id="auth-section" class="bg-white p-8 rounded-xl shadow-md">
            <div class="max-w-md mx-auto">
                <h2 class="text-2xl font-bold text-center mb-6" id="auth-title">Login</h2>
                <form id="auth-form">
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-6">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <button type="submit" id="auth-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">Login</button>
                </form>
                <p class="text-center text-sm text-gray-600 mt-4">
                    <a href="#" id="toggle-auth-mode" class="text-blue-600 hover:underline">Don't have an account? Sign Up</a>
                </p>
            </div>
        </div>

        <!-- Dashboard Section -->
        <main id="dashboard-section" class="hidden">
            
            <!-- Data Entry Forms -->
            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <!-- Transaction Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Add Transaction</h3>
                    <form id="transaction-form">
                        <div class="mb-4">
                            <label for="tr-type" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                            <select id="tr-type" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none form-select">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                         <div class="mb-4">
                            <label for="tr-category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <input type="text" id="tr-category" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Food, Salary" required>
                        </div>
                        <div class="mb-4">
                            <label for="tr-amount" class="block text-sm font-medium text-gray-700 mb-1">Amount</label>
                            <input type="number" id="tr-amount" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00" required>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition">Add Transaction</button>
                    </form>
                </div>
                <!-- Health Log Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Add Daily Health Log</h3>
                    <form id="health-log-form">
                         <div class="mb-4">
                            <label for="hl-sleep" class="block text-sm font-medium text-gray-700 mb-1">Hours Slept</label>
                            <input type="number" id="hl-sleep" step="0.1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., 7.5" required>
                        </div>
                        <div class="mb-4">
                            <label for="hl-mood" class="block text-sm font-medium text-gray-700 mb-1">Mood</label>
                            <select id="hl-mood" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none form-select">
                                <option>Happy</option>
                                <option>Neutral</option>
                                <option>Sad</option>
                                <option>Stressed</option>
                                <option>Energized</option>
                            </select>
                        </div>
                        <div class="h-4"></div> <!-- Spacer -->
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition mt-8">Add Health Log</button>
                    </form>
                </div>
            </div>

            <!-- AI Summary Section -->
            <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
                <h3 class="text-lg font-bold mb-4">Your AI-Powered Summary</h3>
                <button id="get-summary-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition mb-4">Generate My Weekly Summary</button>
                <div id="summary-output" class="p-4 bg-gray-50 rounded-lg min-h-[100px] text-gray-700 whitespace-pre-wrap">Click the button to get your personalized summary.</div>
            </div>

            <!-- Data Display -->
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Transactions List -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Recent Transactions</h3>
                    <div id="transactions-list" class="space-y-3 max-h-96 overflow-y-auto">
                        <!-- Items will be injected here -->
                    </div>
                </div>
                <!-- Health Logs List -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Recent Health Logs</h3>
                    <div id="health-logs-list" class="space-y-3 max-h-96 overflow-y-auto">
                        <!-- Items will be injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged,
            signInWithCustomToken,
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            where, 
            onSnapshot,
            orderBy,
            limit,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- Initialize Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DOM Elements ---
        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const logoutBtn = document.getElementById('logout-btn');
        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-btn');
        const toggleAuthModeLink = document.getElementById('toggle-auth-mode');
        
        const transactionForm = document.getElementById('transaction-form');
        const healthLogForm = document.getElementById('health-log-form');
        
        const transactionsList = document.getElementById('transactions-list');
        const healthLogsList = document.getElementById('health-logs-list');

        const getSummaryBtn = document.getElementById('get-summary-btn');
        const summaryOutput = document.getElementById('summary-output');

        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // --- App State ---
        let isLoginMode = true;
        let currentUser = null;
        let unsubTransactions = null;
        let unsubHealthLogs = null;

        // --- Toast Notification Logic ---
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // --- UI Logic ---
        function toggleAuthUI() {
            isLoginMode = !isLoginMode;
            authTitle.textContent = isLoginMode ? 'Login' : 'Sign Up';
            authBtn.textContent = isLoginMode ? 'Login' : 'Sign Up';
            toggleAuthModeLink.innerHTML = isLoginMode 
                ? "Don't have an account? Sign Up" 
                : 'Already have an account? Login';
        }

        function updateUIForAuthState(user) {
            if (user) {
                currentUser = user;
                authSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                // Start listening to data
                listenToData();
            } else {
                currentUser = null;
                authSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                // Stop listening to data
                if (unsubTransactions) unsubTransactions();
                if (unsubHealthLogs) unsubHealthLogs();
                transactionsList.innerHTML = '';
                healthLogsList.innerHTML = '';
            }
        }
        
        // --- Authentication Logic ---
        onAuthStateChanged(auth, (user) => {
            updateUIForAuthState(user);
        });

        const initialAuth = async () => {
             if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } catch (error) {
                    console.error("Custom token sign-in failed, trying anonymous:", error);
                    await signInAnonymously(auth);
                }
            } else {
                await signInAnonymously(auth);
            }
        };
        initialAuth();


        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                showToast(error.message);
            }
        });

        toggleAuthModeLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleAuthUI();
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout Error:", error);
                showToast(error.message);
            }
        });
        
        // --- Firestore Logic ---
        function listenToData() {
            if (!currentUser) return;

            // Unsubscribe from previous listeners if they exist
            if (unsubTransactions) unsubTransactions();
            if (unsubHealthLogs) unsubHealthLogs();

            // Transactions listener
            const transQuery = query(
                collection(db, `artifacts/${appId}/users/${currentUser.uid}/transactions`), 
                orderBy("timestamp", "desc"), 
                limit(10)
            );
            unsubTransactions = onSnapshot(transQuery, (snapshot) => {
                let html = '';
                if (snapshot.empty) {
                    html = '<p class="text-gray-500">No transactions yet.</p>';
                } else {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : 'No date';
                        const amountColor = data.type === 'income' ? 'text-green-600' : 'text-red-600';
                        const sign = data.type === 'income' ? '+' : '-';
                        html += `
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                <div>
                                    <p class="font-semibold">${data.category}</p>
                                    <p class="text-sm text-gray-500">${date}</p>
                                </div>
                                <p class="font-bold ${amountColor}">${sign}$${data.amount.toFixed(2)}</p>
                            </div>
                        `;
                    });
                }
                transactionsList.innerHTML = html;
            }, (error) => {
                console.error("Transaction listener error:", error);
                showToast("Could not fetch transactions.");
            });

            // Health Logs listener
            const healthQuery = query(
                collection(db, `artifacts/${appId}/users/${currentUser.uid}/health_logs`), 
                orderBy("timestamp", "desc"), 
                limit(10)
            );
            unsubHealthLogs = onSnapshot(healthQuery, (snapshot) => {
                let html = '';
                if (snapshot.empty) {
                    html = '<p class="text-gray-500">No health logs yet.</p>';
                } else {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : 'No date';
                        html += `
                             <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                <div>
                                    <p class="font-semibold">Mood: ${data.mood}</p>
                                    <p class="text-sm text-gray-500">${date}</p>
                                </div>
                                <p class="font-bold text-blue-600">${data.sleepHours} hours sleep</p>
                            </div>
                        `;
                    });
                }
                healthLogsList.innerHTML = html;
            }, (error) => {
                console.error("Health log listener error:", error);
                showToast("Could not fetch health logs.");
            });
        }
        
        transactionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return;
            
            const type = document.getElementById('tr-type').value;
            const category = document.getElementById('tr-category').value;
            const amount = parseFloat(document.getElementById('tr-amount').value);

            try {
                await addDoc(collection(db, `artifacts/${appId}/users/${currentUser.uid}/transactions`), {
                    type,
                    category,
                    amount,
                    timestamp: serverTimestamp()
                });
                transactionForm.reset();
            } catch (error) {
                console.error("Error adding transaction:", error);
                showToast("Failed to add transaction.");
            }
        });

        healthLogForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return;

            const sleepHours = parseFloat(document.getElementById('hl-sleep').value);
            const mood = document.getElementById('hl-mood').value;

            try {
                await addDoc(collection(db, `artifacts/${appId}/users/${currentUser.uid}/health_logs`), {
                    sleepHours,
                    mood,
                    timestamp: serverTimestamp()
                });
                healthLogForm.reset();
            } catch(error) {
                console.error("Error adding health log:", error);
                showToast("Failed to add health log.");
            }
        });

        // --- Gemini API Logic ---
        async function getSummaryFromAI() {
            if (!currentUser) return;

            getSummaryBtn.disabled = true;
            getSummaryBtn.textContent = 'Generating...';
            summaryOutput.innerHTML = '<div class="flex justify-center items-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-700"></div></div>';

            const transactions = [];
            const healthLogs = [];

            // Fetch latest data for summary
            const transQuery = query(collection(db, `artifacts/${appId}/users/${currentUser.uid}/transactions`), orderBy("timestamp", "desc"), limit(20));
            const healthQuery = query(collection(db, `artifacts/${appId}/users/${currentUser.uid}/health_logs`), orderBy("timestamp", "desc"), limit(20));
            
            // This is a simplified fetch; a real app might need more robust data gathering
            const transSnapshot = await getDocs(transQuery);
            transSnapshot.forEach(doc => {
                const data = doc.data();
                transactions.push(`- ${data.type} of $${data.amount.toFixed(2)} for ${data.category} on ${data.timestamp.toDate().toLocaleDateString()}`);
            });

            const healthSnapshot = await getDocs(healthQuery);
            healthSnapshot.forEach(doc => {
                const data = doc.data();
                healthLogs.push(`- On ${data.timestamp.toDate().toLocaleDateString()}, slept ${data.sleepHours} hours and felt ${data.mood}`);
            });

            if (transactions.length === 0 && healthLogs.length === 0) {
                 summaryOutput.textContent = "Not enough data to generate a summary. Please add some transactions and health logs.";
                 getSummaryBtn.disabled = false;
                 getSummaryBtn.textContent = 'Generate My Weekly Summary';
                 return;
            }

            const prompt = `
                Act as a personal financial and health analyst.
                Based on the following recent data, provide a concise, insightful, and supportive summary (3-4 sentences) of my overall well-being.
                Identify any potential connections between my spending and my health. For example, does spending more on "takeout" correlate with less sleep?
                Do not just list the data; synthesize it into a narrative.

                My Recent Transactions:
                ${transactions.join('\n')}

                My Recent Health Logs:
                ${healthLogs.join('\n')}

                Summary:
            `;

            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                    }),
                });

                if (!response.ok) {
                    throw new Error(`API call failed with status: ${response.status}`);
                }

                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (text) {
                    summaryOutput.textContent = text;
                } else {
                    summaryOutput.textContent = 'Could not generate a summary at this time. The model returned an empty response.';
                }

            } catch (error) {
                console.error("Gemini API Error:", error);
                summaryOutput.textContent = 'An error occurred while generating your summary. Please try again later.';
                showToast("Error connecting to AI service.");
            } finally {
                getSummaryBtn.disabled = false;
                getSummaryBtn.textContent = 'Generate My Weekly Summary';
            }
        }
        
        getSummaryBtn.addEventListener('click', getSummaryFromAI);

    </script>
</body>
</html>
