<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Account & Health Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .toast {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }
        .gemini-btn-spinner {
            display: none;
        }
        .gemini-btn.loading .gemini-btn-spinner {
            display: inline-block;
        }
        .gemini-btn.loading .gemini-btn-text {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Toast Notification -->
    <div id="toast" class="toast fixed top-5 right-5 bg-red-500 text-white py-2 px-4 rounded-lg shadow-md">
        <span id="toast-message"></span>
    </div>

    <!-- Main Container -->
    <div id="app-container" class="container mx-auto p-4 max-w-4xl">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Health & Account Tracker</h1>
            <p id="user-id-display" class="text-xs text-gray-500">Local Session</p>
        </header>

        <!-- Dashboard Section -->
        <main id="dashboard-section">
            
            <!-- Data Entry Forms -->
            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <!-- Transaction Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Add Transaction</h3>
                    <form id="transaction-form">
                        <div class="mb-4">
                            <label for="tr-type" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                            <select id="tr-type" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none form-select">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                         <div class="mb-4">
                            <label for="tr-category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <div class="flex items-center space-x-2">
                                <input type="text" id="tr-category" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Coffee with client" required>
                                <button type="button" id="suggest-category-btn" class="gemini-btn p-2 bg-gray-200 hover:bg-gray-300 rounded-lg transition" title="Suggest Category with AI">
                                    <span class="gemini-btn-text">✨</span>
                                    <div class="gemini-btn-spinner animate-spin rounded-full h-4 w-4 border-b-2 border-gray-900"></div>
                                </button>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="tr-amount" class="block text-sm font-medium text-gray-700 mb-1">Amount</label>
                            <input type="number" id="tr-amount" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00" required>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition">Add Transaction</button>
                    </form>
                </div>
                <!-- Health Log Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Add Daily Health Log</h3>
                    <form id="health-log-form">
                         <div class="mb-4">
                            <label for="hl-sleep" class="block text-sm font-medium text-gray-700 mb-1">Hours Slept</label>
                            <input type="number" id="hl-sleep" step="0.1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., 7.5" required>
                        </div>
                        <div class="mb-4">
                            <label for="hl-mood" class="block text-sm font-medium text-gray-700 mb-1">Mood</label>
                            <select id="hl-mood" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none form-select">
                                <option>Happy</option>
                                <option>Neutral</option>
                                <option>Sad</option>
                                <option>Stressed</option>
                                <option>Energized</option>
                            </select>
                        </div>
                        <div class="h-4"></div> <!-- Spacer -->
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition mt-8">Add Health Log</button>
                    </form>
                </div>
            </div>

            <!-- AI Insights Sections -->
            <div class="grid md:grid-cols-2 gap-6">
                <!-- AI Summary Section -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Your AI-Powered Summary</h3>
                    <button id="get-summary-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition mb-4">✨ Generate Retrospective Summary</button>
                    <div id="summary-output" class="p-4 bg-gray-50 rounded-lg min-h-[150px] text-gray-700 whitespace-pre-wrap">Summarize your past week.</div>
                </div>

                <!-- Proactive AI Insights Section -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">✨ Proactive AI Insights</h3>
                    <button id="get-proactive-tips-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-lg transition mb-4">✨ Generate Proactive Tips</button>
                    <div id="proactive-tips-output" class="p-4 bg-gray-50 rounded-lg min-h-[150px] text-gray-700 whitespace-pre-wrap">Get actionable tips for the week ahead.</div>
                </div>
            </div>


            <!-- Data Display -->
            <div class="grid md:grid-cols-2 gap-6 mt-6">
                <!-- Transactions List -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Recent Transactions</h3>
                    <div id="transactions-list" class="space-y-3 max-h-96 overflow-y-auto">
                        <!-- Items will be injected here -->
                    </div>
                </div>
                <!-- Health Logs List -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">Recent Health Logs</h3>
                    <div id="health-logs-list" class="space-y-3 max-h-96 overflow-y-auto">
                        <!-- Items will be injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        // --- DOM Elements ---
        const userIdDisplay = document.getElementById('user-id-display');
        const transactionForm = document.getElementById('transaction-form');
        const healthLogForm = document.getElementById('health-log-form');
        
        const trCategoryInput = document.getElementById('tr-category');
        const suggestCategoryBtn = document.getElementById('suggest-category-btn');

        const transactionsList = document.getElementById('transactions-list');
        const healthLogsList = document.getElementById('health-logs-list');

        const getSummaryBtn = document.getElementById('get-summary-btn');
        const summaryOutput = document.getElementById('summary-output');
        
        const getProactiveTipsBtn = document.getElementById('get-proactive-tips-btn');
        const proactiveTipsOutput = document.getElementById('proactive-tips-output');

        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // --- App State ---
        let transactions = [];
        let healthLogs = [];

        // --- Toast Notification Logic ---
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- Data & Rendering Logic ---
        function saveData() {
            localStorage.setItem('healthTracker-transactions', JSON.stringify(transactions));
            localStorage.setItem('healthTracker-healthLogs', JSON.stringify(healthLogs));
        }

        function loadData() {
            const storedTransactions = localStorage.getItem('healthTracker-transactions');
            const storedHealthLogs = localStorage.getItem('healthTracker-healthLogs');
            if (storedTransactions) {
                transactions = JSON.parse(storedTransactions);
            }
            if (storedHealthLogs) {
                healthLogs = JSON.parse(storedHealthLogs);
            }
        }

        function renderTransactions() {
            let html = '';
            const recentTransactions = transactions.slice(0, 10);
            if (recentTransactions.length === 0) {
                html = '<p class="text-gray-500">No transactions yet.</p>';
            } else {
                recentTransactions.forEach(data => {
                    const date = new Date(data.timestamp).toLocaleDateString();
                    const amountColor = data.type === 'income' ? 'text-green-600' : 'text-red-600';
                    const sign = data.type === 'income' ? '+' : '-';
                    html += `
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                            <div>
                                <p class="font-semibold">${data.category}</p>
                                <p class="text-sm text-gray-500">${date}</p>
                            </div>
                            <p class="font-bold ${amountColor}">${sign}₹${Number(data.amount).toFixed(2)}</p>
                        </div>`;
                });
            }
            transactionsList.innerHTML = html;
        }

        function renderHealthLogs() {
            let html = '';
            const recentLogs = healthLogs.slice(0, 10);
            if (recentLogs.length === 0) {
                html = '<p class="text-gray-500">No health logs yet.</p>';
            } else {
                recentLogs.forEach(data => {
                    const date = new Date(data.timestamp).toLocaleDateString();
                    html += `
                         <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                            <div>
                                <p class="font-semibold">Mood: ${data.mood}</p>
                                <p class="text-sm text-gray-500">${date}</p>
                            </div>
                            <p class="font-bold text-blue-600">${data.sleepHours} hours sleep</p>
                        </div>`;
                });
            }
            healthLogsList.innerHTML = html;
        }

        function renderAllData() {
            renderTransactions();
            renderHealthLogs();
        }
        
        // --- Form Submit Handlers ---
        transactionForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const type = document.getElementById('tr-type').value;
            const category = trCategoryInput.value;
            const amount = parseFloat(document.getElementById('tr-amount').value);

            if (!category || isNaN(amount)) {
                showToast("Please fill out all fields correctly.");
                return;
            }

            const newTransaction = {
                type,
                category,
                amount,
                timestamp: new Date().toISOString()
            };

            transactions.unshift(newTransaction);
            saveData();
            renderTransactions();
            transactionForm.reset();
        });

        healthLogForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const sleepHours = parseFloat(document.getElementById('hl-sleep').value);
            const mood = document.getElementById('hl-mood').value;

            if (isNaN(sleepHours)) {
                showToast("Please enter valid hours slept.");
                return;
            }

            const newLog = {
                sleepHours,
                mood,
                timestamp: new Date().toISOString()
            };
            
            healthLogs.unshift(newLog);
            saveData();
            renderHealthLogs();
            healthLogForm.reset();
        });

        // --- Gemini API Logic ---
        function fetchRecentData() {
            const recentTransactions = transactions.slice(0, 20).map(data => {
                return `- ${data.type} of ₹${Number(data.amount).toFixed(2)} for ${data.category} on ${new Date(data.timestamp).toLocaleDateString()}`;
            });
            const recentHealthLogs = healthLogs.slice(0, 20).map(data => {
                return `- On ${new Date(data.timestamp).toLocaleDateString()}, slept ${data.sleepHours} hours and felt ${data.mood}`;
            });
            return { transactions: recentTransactions, healthLogs: recentHealthLogs };
        }

        async function callGeminiAPI(prompt) {
            const apiKey = "AIzaSyDVYAZClbgwBIDVGn63dV2wf61p4_dWi1Y"; // IMPORTANT: Paste your Google AI Studio API key here
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
             if (!apiKey) {
                showToast("API key is missing. Please add it to the script.");
                throw new Error("API key is missing.");
            }
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
            });

            if (!response.ok) {
                throw new Error(`API call failed with status: ${response.status}`);
            }

            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text;
        }

        async function getSummaryFromAI() {
            getSummaryBtn.disabled = true;
            getSummaryBtn.textContent = 'Generating...';
            summaryOutput.innerHTML = '<div class="flex justify-center items-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-700"></div></div>';

            const { transactions, healthLogs } = fetchRecentData();
            if (transactions.length === 0 && healthLogs.length === 0) {
                 summaryOutput.textContent = "Not enough data to generate a summary.";
                 getSummaryBtn.disabled = false;
                 getSummaryBtn.textContent = '✨ Generate Retrospective Summary';
                 return;
            }

            const prompt = `Act as a personal financial and health analyst. Based on the following recent data, provide a concise, insightful, and supportive summary (3-4 sentences) of my overall well-being. Identify any potential connections between my spending and my health. Synthesize the data into a narrative.

My Recent Transactions:\n${transactions.join('\n')}\n\nMy Recent Health Logs:\n${healthLogs.join('\n')}\n\nSummary:`;
            
            try {
                const text = await callGeminiAPI(prompt);
                summaryOutput.textContent = text || 'Could not generate a summary. The model returned an empty response.';
            } catch (error) {
                console.error("Gemini Summary Error:", error);
                summaryOutput.textContent = 'An error occurred while generating your summary.';
            } finally {
                getSummaryBtn.disabled = false;
                getSummaryBtn.textContent = '✨ Generate Retrospective Summary';
            }
        }

        async function getProactiveTips() {
            getProactiveTipsBtn.disabled = true;
            getProactiveTipsBtn.textContent = 'Generating...';
            proactiveTipsOutput.innerHTML = '<div class="flex justify-center items-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-teal-700"></div></div>';

            const { transactions, healthLogs } = fetchRecentData();
            if (transactions.length === 0 && healthLogs.length === 0) {
                 proactiveTipsOutput.textContent = "Not enough data to generate tips.";
                 getProactiveTipsBtn.disabled = false;
                 getProactiveTipsBtn.textContent = '✨ Generate Proactive Tips';
                 return;
            }

            const prompt = `Act as a supportive personal coach. Based on my recent financial and health data, provide 2-3 encouraging and actionable tips for the upcoming week to improve my overall well-being. The tips should be specific and forward-looking. Format the output as a bulleted list.

My Recent Transactions:\n${transactions.join('\n')}\n\nMy Recent Health Logs:\n${healthLogs.join('\n')}\n\nActionable Tips:`;

            try {
                const text = await callGeminiAPI(prompt);
                proactiveTipsOutput.textContent = text || 'Could not generate tips. The model returned an empty response.';
            } catch (error) {
                console.error("Gemini Tips Error:", error);
                proactiveTipsOutput.textContent = 'An error occurred while generating your tips.';
            } finally {
                getProactiveTipsBtn.disabled = false;
                getProactiveTipsBtn.textContent = '✨ Generate Proactive Tips';
            }
        }
        
        async function suggestCategory() {
            const userInput = trCategoryInput.value;
            if (!userInput.trim()) {
                showToast("Please enter a description first.");
                return;
            }

            suggestCategoryBtn.classList.add('loading');
            suggestCategoryBtn.disabled = true;

            const prompt = `Based on the transaction description "${userInput}", suggest a single, concise expense category. Examples: 'Groceries', 'Utilities', 'Entertainment', 'Transport', 'Healthcare', 'Food & Drink'. Respond with only the category name.`;

            try {
                const text = await callGeminiAPI(prompt);
                if (text) {
                    trCategoryInput.value = text.trim().replace(/['".]+/g, '');
                } else {
                    showToast("AI couldn't suggest a category.");
                }
            } catch (error) {
                console.error("Gemini Category Suggestion Error:", error);
                showToast("Error suggesting category.");
            } finally {
                suggestCategoryBtn.classList.remove('loading');
                suggestCategoryBtn.disabled = false;
            }
        }

        // --- Event Listeners ---
        getSummaryBtn.addEventListener('click', getSummaryFromAI);
        getProactiveTipsBtn.addEventListener('click', getProactiveTips);
        suggestCategoryBtn.addEventListener('click', suggestCategory);

        // --- Initialize App ---
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderAllData();
        });
    </script>
</body>
</html>
