<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Delete Fee Calculator | Druva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #00081a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Deeper Navy from the logo */
        .druva-navy { background-color: #000c26; }
        .druva-navy-dark { background-color: #00081a; }
        .druva-orange { background-color: #fb5144; }
        
        .text-druva-navy { color: #000c26; }
        .text-druva-orange { color: #fb5144; }
        
        .calculator-card {
            background-color: #000c26;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-field {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            background-color: rgba(255, 255, 255, 0.07);
            border-color: #fb5144;
            outline: none;
            box-shadow: 0 0 0 1px #fb5144;
        }

        select.input-field {
            color-scheme: dark;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation / Help Bar -->
    <nav class="druva-navy-dark text-white py-3 px-6 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center">
            <!-- Text Logo -->
            <span class="font-bold tracking-tighter text-2xl lowercase">druva</span>
        </div>
        <a href="https://help.druva.com/en/articles/8651731-about-long-term-retention#h_442d03b357" 
           target="_blank" 
           class="text-xs bg-white/5 hover:bg-white/10 transition-colors px-4 py-2 rounded-full flex items-center gap-2 border border-white/10">
            <span>Help Documentation</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md rounded-3xl p-8 calculator-card">
            <div class="mb-8 text-center">
                <h1 class="text-2xl font-extrabold text-white">Early Delete Fee</h1>
                <p class="text-xs text-gray-500 mt-2 font-medium tracking-widest uppercase">Credit Estimation Tool</p>
                <div class="h-1 w-12 druva-orange mx-auto mt-4 rounded-full"></div>
            </div>

            <div class="space-y-6">
                <!-- Months Input -->
                <div>
                    <label for="months" class="block text-sm font-bold text-gray-300 mb-2">
                        Months in Cold Tier
                    </label>
                    <input 
                        type="number" 
                        id="months" 
                        placeholder="0 - 12" 
                        min="0" 
                        max="12"
                        class="w-full px-4 py-3 rounded-xl input-field"
                    >
                </div>

                <!-- Data Input with Unit Selector -->
                <div>
                    <label for="data" class="block text-sm font-bold text-gray-300 mb-2">
                        Data Volume to Delete
                    </label>
                    <div class="flex">
                        <input 
                            type="number" 
                            id="data" 
                            placeholder="Amount" 
                            step="0.01"
                            class="w-full px-4 py-3 rounded-l-xl input-field border-r-0"
                        >
                        <select 
                            id="unit" 
                            class="px-4 py-3 rounded-r-xl input-field border-l-gray-700 font-bold text-sm cursor-pointer"
                        >
                            <option value="TB">TB</option>
                            <option value="GB">GB</option>
                        </select>
                    </div>
                </div>

                <!-- Result Section -->
                <div class="bg-black/40 rounded-2xl p-6 text-white border border-white/5 relative overflow-hidden shadow-inner">
                    <!-- Subtle background decoration -->
                    <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/5 rounded-full"></div>
                    
                    <div class="text-center relative z-10">
                        <span class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Fee</span>
                        <div id="result" class="text-5xl font-black mb-1">
                            0.00
                        </div>
                        <span class="text-sm font-medium text-druva-orange uppercase tracking-widest">Credits</span>
                    </div>
                </div>

                <!-- Breakdown -->
                <div id="breakdown" class="hidden text-[11px] text-gray-400 text-center font-mono space-y-1 bg-black/20 p-3 rounded-lg border border-white/5">
                    <div id="conversion-notice" class="text-druva-orange font-bold mb-1 hidden">
                        Converted <span id="input-val">0</span> GB to <span id="converted-val">0</span> TB
                    </div>
                    <div class="opacity-60">Formula: 0.35 * (12 - <span id="b-months">0</span>) * <span id="b-data">0</span> TB</div>
                </div>
            </div>

            <div class="mt-8 text-center">
                <p class="text-[10px] text-gray-500 font-medium opacity-50">
                    Calculated based on standard LTR pricing model.
                </p>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-gray-600 text-[10px] uppercase tracking-widest">
        Druva Internal Utility &copy; 2025
    </footer>

    <script>
        const monthsInput = document.getElementById('months');
        const dataInput = document.getElementById('data');
        const unitSelect = document.getElementById('unit');
        const resultDisplay = document.getElementById('result');
        const breakdown = document.getElementById('breakdown');
        const conversionNotice = document.getElementById('conversion-notice');
        const bMonths = document.getElementById('b-months');
        const bData = document.getElementById('b-data');
        const inputVal = document.getElementById('input-val');
        const convertedVal = document.getElementById('converted-val');

        function calculate() {
            const months = parseFloat(monthsInput.value) || 0;
            const rawData = parseFloat(dataInput.value) || 0;
            const unit = unitSelect.value;

            // Convert to TB if unit is GB
            let dataInTB = rawData;
            if (unit === 'GB') {
                dataInTB = rawData / 1024;
            }

            // Cap months at 12 to prevent negative fees
            const monthsRemaining = Math.max(0, 12 - months);
            const fee = 0.35 * monthsRemaining * dataInTB;

            // Update UI
            resultDisplay.innerText = fee.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            // Update Breakdown visibility and values
            if (months > 0 || rawData > 0) {
                breakdown.classList.remove('hidden');
                bMonths.innerText = months;
                bData.innerText = dataInTB.toFixed(4);
                
                if (unit === 'GB' && rawData > 0) {
                    conversionNotice.classList.remove('hidden');
                    inputVal.innerText = rawData;
                    convertedVal.innerText = dataInTB.toFixed(4);
                } else {
                    conversionNotice.classList.add('hidden');
                }
            } else {
                breakdown.classList.add('hidden');
            }
        }

        monthsInput.addEventListener('input', calculate);
        dataInput.addEventListener('input', calculate);
        unitSelect.addEventListener('change', calculate);
    </script>
</body>
</html>
